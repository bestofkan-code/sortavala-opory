plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
// Signing key comes from repository secrets (see README). Without it the APK is
// signed with a throwaway debug key, and each new build then needs a reinstall.
def ksPath = System.getenv('ANDROID_KEYSTORE_FILE')
def hasKey = ksPath && new File(ksPath).exists()

android {
    namespace 'ru.sortavala.opory'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.sortavala.opory'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'opory'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
